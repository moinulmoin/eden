commands:
  install: pnpm install --frozen-lockfile
  test: pnpm run test
  build: pnpm run build
  typecheck: pnpm run typecheck
  lint: pnpm run lint
  cli_test: pnpm --filter @moinulmoin/eden run test
  cli_build: pnpm --filter @moinulmoin/eden run build
  runtime_test: pnpm --filter @moinulmoin/eden-runtime-cloudflare run test
