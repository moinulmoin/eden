name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, typecheck, lint
        run: |
          pnpm run build
          pnpm run typecheck
          pnpm run lint
      - name: Serial test suite
        run: pnpm run test
        env:
          EDEN_OWNED_TERM_GRACE_MS: "5000"
          EDEN_PACKAGE_TEST_TIMEOUT_MS: "600000"
          EDEN_PACKAGE_TEST_SCRIPTS_TIMEOUT_MS: "900000"
          EDEN_WRANGLER_DRY_RUN_TIMEOUT_MS: "120000"
          EDEN_GENERATION_WORK_TIMEOUT_MS: "20000"
          EDEN_GENERATION_PUBLISH_TIMEOUT_MS: "4000"
          EDEN_RUNTIME_PROOF_TIMEOUT_MS: "30000"
          EDEN_RUNTIME_READY_TIMEOUT_MS: "30000"
          EDEN_RUNTIME_WATCHER_TIMEOUT_MS: "30000"
      - name: Local conformance
        run: pnpm run conformance:local
        env:
          EDEN_GENERATION_WORK_TIMEOUT_MS: "20000"
          EDEN_GENERATION_PUBLISH_TIMEOUT_MS: "4000"
          EDEN_RUNTIME_PROOF_TIMEOUT_MS: "30000"
          EDEN_RUNTIME_READY_TIMEOUT_MS: "30000"
          EDEN_RUNTIME_WATCHER_TIMEOUT_MS: "30000"
      - name: Current Eve compatibility
        run: pnpm run compat:eve:local
